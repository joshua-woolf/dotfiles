name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Shellcheck POSIX/bash scripts
        run: shellcheck install.sh stow.sh

      - name: Zsh syntax check
        run: zsh -n dotfiles/.zshrc dotfiles/.zprofile dotfiles/.config/zsh/*.zsh

      - name: Set up EditorConfig Checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393
        with:
          version: v3.8.0

      - name: EditorConfig check
        run: editorconfig-checker

  stow-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Stow dry-run (detect conflicts)
        run: stow -n -v --ignore='\.DS_Store' -d dotfiles -t "$RUNNER_TEMP" .

      - name: Brewfile check (informational)
        run: brew bundle check --file Brewfile || true
