name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh jq

      - name: Shellcheck POSIX/bash scripts
        run: shellcheck install.sh stow.sh

      - name: Zsh syntax check
        run: zsh -n dotfiles/.zshrc dotfiles/.zprofile dotfiles/.config/zsh/*.zsh

      # Installed from the Go module proxy rather than the upstream action,
      # which is not on this org's allowed-actions list.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: EditorConfig check
        run: |
          go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v3.8.0
          "$(go env GOPATH)/bin/editorconfig-checker"

  stow-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Stow dry-run (detect conflicts)
        run: stow -n -v --ignore='\.DS_Store' -d dotfiles -t "$RUNNER_TEMP" .

      - name: Brewfile check (informational)
        run: brew bundle check --file Brewfile || true
