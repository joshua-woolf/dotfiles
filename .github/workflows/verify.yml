name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Dotfiles checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source"
            fi
          done
          timeout --foreground 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          timeout --foreground 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install --no-install-recommends -y \
            ruby \
            stow \
            zsh

      - name: Install mise lint tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.1
          mise_toml: |
            [tools]
            shellcheck = "latest"
            shfmt = "latest"

      - name: Run repository checks
        run: ./scripts/doctor

      - name: Set up EditorConfig Checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393
        with:
          version: v3.8.0

      - name: EditorConfig check
        run: editorconfig-checker

  stow-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Stow dry-run (detect conflicts)
        run: stow -n -v --no-folding --ignore='\.DS_Store' -d dotfiles -t "$RUNNER_TEMP" .

      - name: Brewfile check (informational)
        run: brew bundle check --file Brewfile || true
